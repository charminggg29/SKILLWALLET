<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Event Handling Lab</h1>
        
        <section class="control-group">
            <button id="clickBtn">Click Me!</button>
            <div id="hoverBox" class="box">Hover Over Me</div>
        </section>

        <section class="control-group">
            <input type="text" id="textInput" placeholder="Type something...">
            <p id="keyDisplay">Last key: None</p>
        </section>

        <form id="userForm">
            <input type="text" id="formInput" placeholder="Form input" required>
            <button type="submit">Submit Form</button>
        </form>

        <div id="outputArea">
            <strong>Action Log:</strong>
            <p id="status">Waiting for interaction...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
