<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Data Rendering</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #0b1220; color: #e8eefc; }
      .card { max-width: 900px; margin: 0 auto; background: #111b33; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      .muted { color: rgba(232, 238, 252, 0.7); }
      .loader { padding: 12px 0; }
      .error { padding: 12px; background: rgba(255, 0, 0, 0.12); border: 1px solid rgba(255, 0, 0, 0.35); border-radius: 10px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      li { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; }
      .title { font-weight: 700; margin-bottom: 6px; }
      .meta { font-size: 12px; color: rgba(232, 238, 252, 0.65); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React (UMD builds) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel (for JSX in browser). This is a teaching/demo setup. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- App -->
    <script type="text/babel" data-allow-imports>
      const { useEffect, useState } = React;

      // Inline components are used here because the no-build environment
      // can't load JSX files directly.
      function Loader() {
        return (
          <div className="loader" aria-busy="true">
            <div className="muted">Loading posts...</div>
          </div>
        );
      }

      function DataList({ items }) {
        return (
          <ul>
            {items.map((post) => (
              <li key={post.id}>
                <div className="title">{post.title}</div>
                <div className="meta">Post ID: {post.id}</div>
                <div className="muted">{post.body}</div>
              </li>
            ))}
          </ul>
        );
      }

      function App() {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        useEffect(() => {
          let cancelled = false;

          async function fetchPosts() {
            setLoading(true);
            setError(null);

            try {
              const res = await fetch('https://jsonplaceholder.typicode.com/posts');
              if (!res.ok) throw new Error(`Request failed with status ${res.status}`);
              const json = await res.json();
              if (!cancelled) setData(json);
            } catch (e) {
              if (!cancelled) setError(e?.message ?? 'Failed to load data');
            } finally {
              if (!cancelled) setLoading(false);
            }
          }

          fetchPosts();
          return () => {
            cancelled = true;
          };
        }, []);

        return (
          <div className="card">
            <h1>API Data Rendering (React)</h1>

            {loading && <Loader />}

            {!loading && error && (
              <div className="error" role="alert">
                <div style={{ fontWeight: 700, marginBottom: 6 }}>Error</div>
                <div className="muted">{error}</div>
              </div>
            )}

            {!loading && !error && <DataList items={data} />}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>

  </body>
</html>
